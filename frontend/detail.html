<!DOCTYPE html>
<html lang="id" class="bg-gray-50 text-gray-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WA Automation - Detail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">
  
  <div data-app-nav></div>

  <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white shadow overflow-hidden sm:rounded-lg border border-gray-200">
      <div class="px-4 py-5 sm:px-6 flex items-center justify-between border-b border-gray-200 gap-4">
        <div class="flex items-center gap-3 min-w-0">
          <a href="/dashboard" class="inline-flex items-center justify-center w-10 h-10 rounded-full border border-gray-200 bg-white text-gray-700 hover:bg-gray-100 transition-colors shrink-0" aria-label="Kembali ke dashboard">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          </a>
          <div class="min-w-0">
            <h3 class="text-lg leading-6 font-medium text-gray-900">Detail Automation</h3>
            <p class="mt-1 max-w-2xl text-sm text-gray-500">Informasi lengkap tentang automation ini.</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <a id="btnEdit" href="#" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[#da008f] hover:bg-[#b8007a] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-300">
            Edit Automation
          </a>
          <button id="btnStatus" type="button" disabled class="inline-flex items-center px-4 py-2 border rounded-md shadow-sm text-sm font-medium focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50">
            Memuat status...
          </button>
          <button id="btnRemove" type="button" class="inline-flex items-center px-4 py-2 border border-red-300 rounded-md shadow-sm text-sm font-medium text-red-700 bg-white hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
            Remove
          </button>
        </div>
      </div>
      <div id="detailContent" class="p-6">
        <div class="flex justify-center py-12">
          <svg class="animate-spin h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { checkAuth } from './auth-check.js';
    import './nav.js';

    checkAuth().then((auth) => {
      if (auth) import('./detail.js');
    });
  </script>
</body>
</html>

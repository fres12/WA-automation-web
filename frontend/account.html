<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WA Automation - Akun</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div data-app-nav></div>
  <main class="account-panel">
    <h1>Akun</h1>
    <p class="subtitle">Informasi profil akun yang sedang digunakan.</p>
    <div id="accountError" class="error-msg" role="alert"></div>
    <div class="account-details" aria-live="polite">
      <div class="account-row"><span>Username</span><strong id="profileUsername">Memuat...</strong></div>
      <div class="account-row"><span>Email</span><strong id="profileEmail">Memuat...</strong></div>
    </div>
    <button id="logoutButton" class="btn-primary account-logout" type="button">Logout</button>
  </main>
</body>
<script type="module">
  import { checkAuth } from './auth-check.js';
  import './nav.js';
  import './account.js';
  
  checkAuth();
</script>
</html>

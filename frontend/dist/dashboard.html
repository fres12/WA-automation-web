<!DOCTYPE html>
<html lang="id" class="bg-gray-50 text-gray-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WA Automation - Dashboard</title>
  <!-- Tidak perlu link external Tailwind karena sudah diproses Vite + PostCSS -->
  <script type="module" crossorigin src="/assets/dashboard-Ck5WHHq9.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/nav-DbDnNZkH.js">
  <link rel="modulepreload" crossorigin href="/assets/preload-helper-D7HrI6pR.js">
  <link rel="stylesheet" crossorigin href="/assets/style-B9BoBxME.css">
</head>
<body class="min-h-screen flex flex-col">
  
  <div data-app-nav></div>

  <main class="flex-grow w-full max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="md:flex md:items-center md:justify-between mb-8">
      <div class="flex-1 min-w-0">
        <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
          Daftar Automation
        </h2>
        <p class="mt-1 text-sm text-gray-500">
          Kelola jadwal pengiriman WhatsApp blast Anda.
        </p>
      </div>
      <div class="mt-4 flex md:mt-0 md:ml-4">
        <a href="/" class="ml-3 inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
          <svg class="-ml-1 mr-2 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          Buat Baru
        </a>
      </div>
    </div>

    <!-- Table Container -->
    <div class="bg-white shadow overflow-hidden sm:rounded-lg border border-gray-200">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200" id="automationsTable">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nama Automation</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dibuat Pada</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Terakhir Dijalankan</th>
              <th scope="col" class="relative px-6 py-3">
                <span class="sr-only">Aksi</span>
              </th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200" id="automationsBody">
            <!-- Loading state -->
            <tr>
              <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                <svg class="animate-spin h-8 w-8 mx-auto text-blue-500 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Memuat data...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

</body>
</html>
